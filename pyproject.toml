[project]
name = "del-sensor-al-agente"
version = "0.1.0"
description = "Demo: del sensor al agente de Copilot Studio en Teams"
requires-python = ">=3.11"
license = { text = "MIT" }

[project.scripts]
simulate = "simulator.cli:main"

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = [".venv", "spikes"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
