# Configuración de gitleaks (T-002 · RNF-05, CA-13.5)
# Extiende las reglas por defecto de gitleaks; no desactiva ninguna.
title = "del-sensor-al-agente"

[extend]
useDefault = true

# Excepciones explícitas y mínimas. Cada una lleva su motivo.
[allowlist]
description = "Valores ficticios documentados en specs/02-plan.md"
regexes = [
  # eventId de ejemplo del mensaje de la Function al flujo DisparoAgente (plan §4.5).
  # Es un UUID inventado, no un identificador de tenant ni una credencial.
  '''3f2b8a4e-6c1d-4e9a-9f7b-2d5c8e1a0b37''',
  # Cadena de conexión inventada de las pruebas del simulador: host .example (RFC 2606)
  # y clave "clavefalsa" en base64. No da acceso a nada.
  '''HostName=hub-falso\.example;DeviceId=sim-01;SharedAccessKey=Y2xhdmVmYWxzYQ==''',
  # Token inventado de las pruebas de la Function (tests/function/conftest.py): su carga
  # decodificada es {"fake":"token"}. Las pruebas comprueban que nunca aparece en los registros.
  '''eyJ0eXAiOiJKV1QiLCJmYWtlIjoidG9rZW4ifQ\.ZmFrZQ\.ZmFrZQ''',
  # Identificador público del rol integrado Key Vault Secrets User (infra/modules/keyvault.bicep),
  # documentado en Microsoft Learn. Es el mismo en todos los tenants; no es una credencial.
  '''4633458b-17de-408a-b874-0445c86b69e6''',
]
